[package]
name = "lattice-primitives"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
[dependencies]
lattice-cashew = { path = "../../../cashew-rs" }
lattice-multikey = { path = "../../../multikey-rs" }
lattice-pow = { path = "../lattice-pow" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
cid = "0.11"
num-bigint = "0.4"
thiserror = "2"
