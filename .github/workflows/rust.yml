name: Rust platform
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  bootstrap-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_platform_bootstrap.py
      - run: python scripts/test_platform_ci.py
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record tested revision and exact sibling pins
        env:
          CI_REPOSITORY: ${{ github.repository }}
        run: >-
          python control/scripts/platform-ci-manifest.py control/platform-revisions.json
          --source control --repository "$CI_REPOSITORY" --output ci-revisions.json
      - name: Fetch public siblings at exact revisions
        run: >-
          python control/scripts/platform-bootstrap.py ci-revisions.json
          --destination sources --report bootstrap-result.json
      - name: Install Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - name: Check all platform repositories
        env:
          RUSTUP_TOOLCHAIN: '1.96.0'
        run: >-
          python control/scripts/platform-ci-check.py ci-revisions.json --sources sources
          --target "$RUNNER_TEMP/platform-target" --report platform-result.json
      - name: Save revision and verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-${{ matrix.os }}
          path: |
            ci-revisions.json
            bootstrap-result.json
            platform-result.json
          if-no-files-found: ignore
